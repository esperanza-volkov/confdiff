<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
<title>confdiff — semantic, secret-safe config diff (animated demo)</title>
<rect width="760" height="300" rx="11" fill="#0d1117"/>
<rect width="760" height="36" rx="11" fill="#161b22"/>
<rect y="26" width="760" height="10" fill="#161b22"/>
<circle cx="22" cy="18" r="6" fill="#f66151"/>
<circle cx="42" cy="18" r="6" fill="#e9ad0c"/>
<circle cx="62" cy="18" r="6" fill="#33d17a"/>
<text x="380.0" y="23" fill="#7d8590" text-anchor="middle" font-size="12">confdiff — semantic, secret-safe config diff</text>
<text x="16" y="62" fill="#3fb950">$</text>
<clipPath id="type"><rect x="34" y="44" height="26" width="0">
<animate attributeName="width" values="0;0;319.2;319.2;319.2;0" keyTimes="0;0.03;0.2182;0.8727;0.999;1" dur="11.0s" repeatCount="indefinite" calcMode="linear"/></rect></clipPath>
<g clip-path="url(#type)"><text x="34" y="62" fill="#e6edf3" xml:space="preserve">confdiff prod.env staging.env --redact</text></g>
<rect y="50" width="8" height="16" fill="#e6edf3" x="34">
<animate attributeName="x" values="34;34;353.2;353.2" keyTimes="0;0.03;0.2182;1" dur="11.0s" repeatCount="indefinite" calcMode="linear"/>
<animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
</rect>
<g opacity="0"><text x="34" y="96" xml:space="preserve"><tspan fill="#d29922">~ </tspan><tspan fill="#e6edf3">API_TOKEN    </tspan><tspan fill="#6e7681">«redacted:f57ea9»</tspan><tspan fill="#6e7681"> =&gt; </tspan><tspan fill="#6e7681">«redacted:d4a89c»</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2636;0.2836;0.8727;0.9327;1" dur="11.0s" repeatCount="indefinite" calcMode="linear"/></g>
<g opacity="0"><text x="34" y="119" xml:space="preserve"><tspan fill="#d29922">~ </tspan><tspan fill="#e6edf3">DB_PASSWORD  </tspan><tspan fill="#6e7681">«redacted:faac14»</tspan><tspan fill="#6e7681"> =&gt; </tspan><tspan fill="#6e7681">«redacted:726de5»</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2955;0.3155;0.8727;0.9327;1" dur="11.0s" repeatCount="indefinite" calcMode="linear"/></g>
<g opacity="0"><text x="34" y="142" xml:space="preserve"><tspan fill="#d29922">~ </tspan><tspan fill="#e6edf3">LOG_LEVEL    </tspan><tspan fill="#a5d6ff">"info"</tspan><tspan fill="#6e7681"> =&gt; </tspan><tspan fill="#a5d6ff">"debug"</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3273;0.3473;0.8727;0.9327;1" dur="11.0s" repeatCount="indefinite" calcMode="linear"/></g>
<g opacity="0"><text x="34" y="173" xml:space="preserve"><tspan fill="#7d8590">3 changes: </tspan><tspan fill="#7d8590">3 changed</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3682;0.3882;0.8727;0.9327;1" dur="11.0s" repeatCount="indefinite" calcMode="linear"/></g>
<g opacity="0"><text x="16" y="213" fill="#57ab5a" font-size="12.5" font-style="italic" xml:space="preserve">✓ keys reordered + a comment added in staging — reported as 0 noise, only real changes shown</text>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4091;0.4291;0.8727;0.9327;1" dur="11.0s" repeatCount="indefinite" calcMode="linear"/>
