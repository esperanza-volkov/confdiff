<text x="360.0" y="22" fill="#7d8590" text-anchor="middle" font-size="12">confdiff — semantic config diff</text>
<text x="20.0" y="56" fill="#58a6ff" xml:space="preserve">$ </text>
<text x="36.8" y="56" fill="#c9d1d9" xml:space="preserve">confdiff old.yaml new.yaml</text>
