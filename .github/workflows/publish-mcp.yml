name: Publish to MCP Registry

# Publishes the confdiff-mcp server metadata to the official MCP Registry
# (registry.modelcontextprotocol.io) using GitHub OIDC — no secrets required.
# The npm package `confdiff-mcp` must already be published (its package.json
# carries the `mcpName` ownership marker that the registry verifies).
# Run manually (workflow_dispatch) once per new version, after the confdiff-mcp
# npm package has been published and server.json's version bumped. The registry
# rejects duplicate versions, so this must fire exactly once per version.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
